name: hermes-plant
version: "1.0.0"
description: "A calm houseplant for Hermes Desktop that grows slowly in real time over days and weeks. It sits above the app like the Hermes pet, takes no layout space, and can be dragged anywhere. Click it for a care wheel: water, prune, rotate, feed, repot, or ask Hermes. Pruning shapes how it branches, so every plant differs, and neglect only pauses it. Two agent tools let Hermes check the plant and tend it when you ask. Disclosures: no network requests, no background model calls and no background processes; growth is worked out from saved timestamps. Ask Hermes sends one chat message, and only when you press it. The plant is stored in Hermes plugin storage on this machine. Hermes has no plugin area for this kind of overlay, so the plugin adds its own element to the page and removes it when unloaded."
author: tuancookiez
license: MIT
manifest_version: 1
kind: standalone
requires_hermes: ">=0.22.7"

provides_tools:
  - plant_status
  - plant_tend

provides_hooks: []
requires_env: []
tags: [desktop, companion, game, calm]
